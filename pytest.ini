[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    error::SyntaxWarning
    # Flet 0.8x ostrzega o ElevatedButton przy KAŻDYM zbudowanym przycisku, co
    # przy kilkuset widokach daje setki linii szumu. Usuń tę linię przy
    # przechodzeniu na Flet 1.0 — wtedy ostrzeżenia są listą roboczą.
    ignore:.*ElevatedButton is deprecated.*:DeprecationWarning
