# Wersja, którą Android pokazuje w informacjach o aplikacji — `flet build apk`
# bierze ją stąd (--build-name). To ZAWSZE najnowsze wydanie z listy „Co nowego”
# (db/nowosci.py, numer = data wydania); zgodności pilnuje tests/test_co_nowego.py.
# Sekcja świadomie bez `name` i `dependencies`: nazwa paczki zostaje z nazwy
# folderu, a zależności z requirements.txt — dokładnie tak, jak bez tej sekcji.
[project]
version = "2026.10.5.2"

[tool.flet]
# Aparat w aplikacji (flet-camera, kolejka paragonów „do wpisania”). Gotowy
# zestaw Fleta: uprawnienie CAMERA na Androidzie, opis dla iOS i aparat jako
# sprzęt NIEWYMAGANY — telefon bez aparatu nadal zainstaluje aplikację
# (paragon doda wtedy z galerii).
permissions = ["camera"]

[tool.flet.app]
# Co NIE ma trafić do paczki. Ścieżki dopasowują się dokładnie (bez masek),
# katalogi rekurencyjnie. `build/` Flet wyklucza sam.
exclude = [
    ".venv", ".git", ".github", "__pycache__", ".pytest_cache",
    "tests", "pytest.ini",
    "zalaczniki", "zalaczniki_bak", "zalaczniki_odroczone", "kosz_zalaczniki",
    "flota_zadania.db", "flota_zadania.db.bak", "kopia_baza.zip",
    # Automatyczne kopie zapasowe z komputera — dziesiątki MB, które nie mają
    # prawa pojechać do APK.
    "kopie",
    # Log rotuje się na trzy pliki, a maski tu nie działają — stąd wypisane co do jednego.
    "flota.log", "flota.log.1", "flota.log.2",
    "supabase",
]

[tool.flet.android]
# Bez tego Flet buduje jeden „gruby" APK z TRZEMA architekturami naraz — czyli
# trzy komplety bibliotek natywnych (cryptography, pydantic_core, Pillow,
# fontTools, runtime Pythona, silnik Fluttera). Same pakiety Pythona to 37 MB
# na architekturę.
#
# arm64-v8a ma każdy telefon wydany po mniej więcej 2019 roku. armeabi-v7a to
# 32-bitowe urządzenia sprzed tamtej daty, x86_64 wyłącznie emulatory. Jeśli
# druga osoba ma stary telefon, dopisz tu "armeabi-v7a" — APK urośnie o tyle,
# ile waży drugi komplet.
target_arch = ["arm64-v8a"]

# Domyślne („nowoczesne") pakowanie trzyma biblioteki .so NIESKOMPRESOWANE:
# szybszy start, ale surowy plik .apk jest z grubsza dwa razy większy. Ma to
# sens przy Google Play, które pakuje po swojemu przed wysłaniem na telefon.
# Przy APK-u wysyłanym drugiej osobie na WhatsAppie liczy się rozmiar pliku,
# więc wracamy do kompresji.
#
# Gdybyś kiedyś wystawiał aplikację w Google Play: zbuduj `flet build aab`
# i USUŃ tę linijkę — tam nowoczesne pakowanie daje mniejsze pobranie.
legacy_packaging = true

[tool.flet.android.deep_linking]
# Link zaproszenia carsapp://app/dolacz/<KOD> — kod QR na ekranie
# Współdzielenia i zaproszenie wysłane SMS-em — otwiera aplikację na ekranie
# dołączania z wpisanym kodem. Na Androida Flet czyta TYLKO tę sekcję
# (`[tool.flet.deep_linking]` bez `.android` jest dla innych platform).
# Muszą się zgadzać z sync/stale.py (SCHEMAT_LINKU, HOST_LINKU) — pilnuje tego
# tests/test_zaproszenia.py. Małymi literami: Android porównuje je dosłownie.
# Działa od pierwszego APK zbudowanego z tą sekcją.
scheme = "carsapp"
host = "app"
